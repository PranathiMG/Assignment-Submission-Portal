<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1f1f1f;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        h2 { color: #00bcd4; }

        .assignment-card {
            background-color: #2c2c2c;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .assignment-card h4 { margin: 0 0 10px 0; color: #00bcd4; }

        input[type="file"] {
            padding: 5px;
            background-color: #1f1f1f;
            border: 1px solid #00bcd4;
            border-radius: 5px;
            color: #fff;
        }

        button {
            background-color: #00bcd4;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover { background-color: #00a0b0; }

        .uploaded-file a { color: #ff9800; text-decoration: none; }

        .logout { display: block; margin-top: 30px; color: #00bcd4; text-decoration: none; font-weight: bold; }
        .logout:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <h2>Welcome {{ student.username }}</h2>
    <h3>Your Assignments</h3>

    {% for task in tasks %}
    <div class="assignment-card">
        <h4>Subject: {{ task.title }}</h4>
        <form method="POST" enctype="multipart/form-data" action="{{ url_for('upload') }}">
            <input type="hidden" name="task_id" value="{{ task.id }}">
            <input type="file" name="file" required>
            <button type="submit">Upload</button>
        </form>

        {% for submission in submissions %}
            {% if submission.task_id == task.id %}
                <div class="uploaded-file">
                    Uploaded file: <a href="{{ url_for('download_file', filename=submission.filename) }}">{{ submission.filename }}</a>
                </div>
            {% endif %}
        {% endfor %}
    </div>
    {% endfor %}

    <a href="{{ url_for('logout') }}" class="logout">Logout</a>
</div>
</body>
</html>
